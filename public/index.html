function calculateLittleLeagueAge(birthMonth, birthYear) {
    // Define the cutoff date for the age determination (August 31, 2025)
    const cutoffDate = new Date('2025-08-31');
    
    // Create the birth date using the given month (1-based) and year
    const birthDate = new Date(birthYear, birthMonth - 1);

    // Calculate the age as of the cutoff date
    let age = cutoffDate.getFullYear() - birthDate.getFullYear();

    // Adjust age if the birth date is after the cutoff date in the year
    if (
        birthDate.getMonth() > cutoffDate.getMonth() ||
        (birthDate.getMonth() === cutoffDate.getMonth() && birthDate.getDate() > cutoffDate.getDate())
    ) {
        age -= 1;
    }

    return age;
}
